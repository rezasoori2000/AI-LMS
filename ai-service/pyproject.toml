[project]
name = "lms-ai-service"
version = "0.1.0"
description = "AI service for the LMS platform — tutoring, RAG, scoring, insights"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.115.14",
    "uvicorn[standard]==0.46.0",
    "pydantic-settings==2.14.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==1.3.0",
    "ruff==0.11.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
ignore = [
    "N818",  # Exception name should end with "Error" — allow domain-specific naming
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
